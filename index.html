<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kopkar AKM">
  <title>Kopkar AKM Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
    .touch-target { min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; }
    .card-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #e5e7eb; padding-bottom: env(safe-area-inset-bottom); display: flex; justify-content: space-around; z-index: 50; }
    .nav-item { flex: 1; text-align: center; padding: 10px 0; color: #9ca3af; font-size: 10px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: #4f46e5; }
    .nav-item svg { width: 24px; height: 24px; }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; padding: 10px 0; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #4f46e5; cursor: pointer; margin-top: -10px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #d1d5db; border-radius: 3px; }
    
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background-color: white; padding-bottom: 0; }
      .no-print, .bottom-nav { display: none !important; }
      .print-only { display: block !important; }
      h1 { font-size: 20px !important; margin-bottom: 10px; }
      p, td, th { font-size: 10px !important; color: #000 !important; }
      .print-border { border: 1px solid #000 !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="text-slate-800 select-none">

  <!-- Input File Tersembunyi -->
  <input type="file" id="evidence-upload" class="hidden" accept="image/*,application/pdf">
  <input type="file" id="restore-file" class="hidden" accept=".json" onchange="restoreBackup(this)">

  <!-- Header -->

    <div class="px-4 h-16 flex justify-between items-center">
      <div class="flex items-center gap-3">

        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Kopkar AKM</h1>
          <p class="text-xs text-slate-500">Career Planner 2025</p>
        </div>
      </div>
      <div class="flex gap-2">
          <button onclick="installPWA()" id="install-btn" class="hidden bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1">Install</button>
          <button onclick="downloadBackup()" class="bg-emerald-50 text-emerald-600 p-2 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg></button>
           <label for="restore-file" class="bg-blue-50 text-blue-600 p-2 rounded-full cursor-pointer"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg></label>
      </div>
    </div>
    <div class="px-4 pb-3">
        <select id="global-emp-select" onchange="changeEmpGlobal(this.value)" class="w-full bg-slate-100 border-none rounded-xl py-2.5 px-4 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-500">
            <!-- Options injected by JS -->
        </select>
    </div>
  </header>

  <!-- Main Content -->
  <main class="px-4 py-4 min-h-screen" id="app-content"></main>

  <!-- Bottom Nav -->

  <!-- Modal Input -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[60] flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full sm:max-w-md sm:rounded-xl rounded-t-2xl shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modal-panel">
      <div class="sticky top-0 bg-white z-10 px-4 py-3 border-b flex justify-between items-center rounded-t-2xl">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto absolute left-0 right-0 top-2"></div>
        <h3 class="text-lg font-bold text-slate-900 mt-2" id="modal-title">Judul</h3>
        <button onclick="closeModal()" class="text-slate-400 p-2 mt-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <div class="p-5 pb-10 space-y-4" id="modal-body"></div>
    </div>
  </div>

  <!-- Evidence Modal (Preview) -->
  <div id="evidence-modal" class="fixed inset-0 bg-black/90 hidden z-[70] flex flex-col items-center justify-center p-4">
      <div class="w-full flex justify-between items-center mb-4 px-4">
          <h3 class="text-white font-bold text-lg">Bukti Dukung</h3>
          <button onclick="document.getElementById('evidence-modal').classList.add('hidden')" class="bg-white/20 text-white p-2 rounded-full"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <div id="evidence-content" class="w-full max-w-md bg-white rounded-lg overflow-hidden max-h-[80vh] flex items-center justify-center"></div>
  </div>

  <!-- Print Container -->
  <div id="print-container" class="print-only"></div>

      },
      'yuliani': {

        competencies: [

      },

        competencies: [
            { name: 'Komunikasi & Adaptasi', ref: 'CV (Soft Skill)', current: 4, target: 5 },

      }
    };

    // --- STATE ---
    let state = {
      employees: JSON.parse(localStorage.getItem('kopkarMobileVFinal3')) || initialEmployees,
      activeTab: 'dashboard',
      selectedEmpId: 'mahmudah',
      modalConfig: null,
      uploadContext: null
    };

    const saveState = () => {
      localStorage.setItem('kopkarMobileVFinal3', JSON.stringify(state.employees));
      // Note: Removed renderApp() from here to prevent keyboard dismissal
    };

    // --- MANIFEST PWA ---
    const manifest = { "name": "Kopkar AKM", "short_name": "Kopkar AKM", "start_url": ".", "display": "standalone", "background_color": "#ffffff", "theme_color": "#4f46e5", "icons": [ { "src": "https://ui-avatars.com/api/?name=AKM&background=4f46e5&color=fff&size=192", "sizes": "192x192", "type": "image/png" }, { "src": "https://ui-avatars.com/api/?name=AKM&background=4f46e5&color=fff&size=512", "sizes": "512x512", "type": "image/png" } ] };
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: 'application/json'})); document.head.appendChild(link);

    // --- INSTALL LOGIC ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('install-btn').classList.remove('hidden'); });
    async function installPWA() { if (deferredPrompt) { deferredPrompt.prompt(); if ((await deferredPrompt.userChoice).outcome === 'accepted') { deferredPrompt = null; document.getElementById('install-btn').classList.add('hidden'); } } }

    // --- APP RENDERER ---
    function renderNav() {
      const tabs = [
        { id: 'dashboard', label: 'Home', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'competency', label: 'Skill', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
        { id: 'kpi', label: 'KPI', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
        { id: 'report', label: 'Laporan', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' }
      ];
      
      document.getElementById('bottom-nav').innerHTML = tabs.map(t => `
        <button onclick="setTab('${t.id}')" class="nav-item ${state.activeTab === t.id ? 'active' : ''}">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg>
          <span>${t.label}</span>
        </button>
      `).join('');

      const sel = document.getElementById('global-emp-select');
      if(sel.options.length === 0) {
          sel.innerHTML = Object.values(state.employees).map(e => `<option value="${e.id}">${e.name}</option>`).join('');
      }
      sel.value = state.selectedEmpId;
    }

    function renderApp() {
      renderNav();
      const content = document.getElementById('app-content');
      
      if (state.activeTab === 'dashboard') renderDashboard(content);
      else if (state.activeTab === 'competency') renderCompetency(content);
      else if (state.activeTab === 'kpi') renderKPI(content);
      else if (state.activeTab === 'report') renderReport(content);
    }

    // --- 1. DASHBOARD (MOBILE CARD) ---
    function renderDashboard(el) {
      const e = state.employees[state.selectedEmpId];
      const kpiOk = e.kpis.filter(k => k.status === true).length;
      const pct = Math.round((kpiOk / e.kpis.length) * 100);
      
      const emps = Object.values(state.employees);
      const approvedCount = emps.filter(emp => emp.approval.manager.date).length;

      el.innerHTML = `
        <div class="space-y-4 pb-20">
          <!-- Welcome Card -->
          <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-indigo-200">
            <div class="flex justify-between items-start">
                <div>
                    <p class="opacity-80 text-xs mb-1 font-medium uppercase tracking-wider">Performance Dashboard</p>
                    <h2 class="text-2xl font-bold mb-4">${e.name.split(',')[0]}</h2>
                </div>
                <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                    <span class="text-2xl font-bold">${pct}%</span>
                </div>
            </div>
            
            <div class="mt-2">
                <div class="flex justify-between text-xs opacity-80 mb-1">
                    <span>Capaian KPI</span>
                    <span>${kpiOk}/${e.kpis.length}</span>
                </div>
                <div class="w-full bg-indigo-800 rounded-full h-1.5">
                  <div class="bg-white h-1.5 rounded-full transition-all duration-1000" style="width: ${pct}%"></div>
                </div>
            </div>
          </div>

          <!-- Stats Cards -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl card-shadow border border-slate-50">
               <p class="text-xs text-gray-400 uppercase font-bold mb-1">Target Unit</p>
               <p class="text-sm font-bold text-slate-800 truncate">${e.kpis[0].target.split('(')[0]}</p> 
            </div>
             <div class="bg-white p-4 rounded-xl card-shadow border border-slate-50">
               <p class="text-xs text-gray-400 uppercase font-bold mb-1">Status Tim</p>
               <p class="text-sm font-bold text-green-600">${approvedCount} / ${emps.length} Laporan OK</p> 
            </div>
          </div>

          <!-- Career Focus -->
          <div class="bg-white rounded-xl p-5 card-shadow">
            <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-sm">
              <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
              Fokus Karir 2025
            </h3>
            <ul class="space-y-3">
              ${e.careerPath.short.slice(0, 3).map(i => `
                <li class="flex gap-3 items-start text-xs text-slate-600">
                  <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mt-1 shrink-0"></span>
                  ${i}
                </li>
              `).join('')}
            </ul>
            <button onclick="setTab('report')" class="mt-4 w-full py-3 rounded-xl bg-slate-50 text-indigo-600 text-xs font-bold hover:bg-indigo-50 transition-colors">Lihat Laporan Lengkap</button>
          </div>
        </div>
      `;
    }

    // --- 2. KPI (TOUCH FRIENDLY) ---
    function renderKPI(el) {
      const e = state.employees[state.selectedEmpId];
      const globalKpis = e.kpis.filter(k => k.type === 'global');
      const detailKpis = e.kpis.filter(k => k.type !== 'global');

      const renderKpiCard = (k, idx) => `
        <div class="bg-white p-4 rounded-xl card-shadow border border-transparent hover:border-indigo-200 transition-colors ${k.status === false ? 'border-red-100' : ''}">
            <div class="mb-3">
                <div class="flex justify-between items-start">
                    <h4 class="font-bold text-slate-800 text-sm leading-snug w-2/3">${k.name}</h4>
                    ${k.status === true ? '<span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">TERCAPAI</span>' : ''}

                </div>
                <div class="mt-1 text-xs text-slate-500 bg-slate-50 inline-block px-2 py-1 rounded border border-slate-100">Target: ${k.target}</div>
            </div>
            <div class="flex items-center justify-between gap-3 mt-4 pt-3 border-t border-slate-100">
                <div class="flex gap-2">
                    ${k.evidence 
                        ? `<button onclick="viewEvidence('${e.id}', ${idx})" class="touch-target w-10 h-10 rounded-full bg-blue-50 text-blue-600 border border-blue-200"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></button><button onclick="deleteEvidence('${e.id}', ${idx})" class="touch-target w-10 h-10 rounded-full bg-red-50 text-red-400 border border-red-200"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>`

                    }

                    <button onclick="deleteItem('kpis', '${e.id}', ${idx})" class="touch-target w-10 h-10 rounded-full bg-red-50 text-red-500 hover:bg-red-100"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                    <button onclick="updateKpiStatus('${e.id}', ${idx}, false)" class="touch-target w-10 h-10 rounded-full border border-slate-200 ${k.status === false ? 'bg-red-500 text-white border-red-500 shadow-md shadow-red-200' : 'bg-white text-slate-400'}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>

      el.innerHTML = `

             <h2 class="text-lg font-bold text-slate-800">Target KPI 2025</h2>
             <button onclick="openModal('ADD_KPI')" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full text-xs font-bold hover:bg-indigo-100">+ Tambah</button>

          <!-- Global KPIs -->

             <h3 class="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-3 pl-1">Target Utama (Global)</h3>
             <div class="space-y-4">
                ${globalKpis.map((k, i) => {
                    // Find original index

             <div class="space-y-4">
                ${detailKpis.map((k, i) => {

    // --- 3. COMPETENCY (SLIDER UI) ---
    function renderCompetency(el) {
      const e = state.employees[state.selectedEmpId];
      el.innerHTML = `<div class="space-y-4 pb-20"><div class="flex justify-between items-center px-1"><h2 class="text-lg font-bold text-slate-800">Kompetensi (SOP)</h2><button onclick="openModal('ADD_COMP')" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full text-xs font-bold hover:bg-indigo-100">+ Tambah</button></div>${e.competencies.map((c, idx) => `<div class="bg-white p-5 rounded-xl card-shadow"><div class="flex justify-between items-start mb-4"><div><h4 class="font-bold text-slate-800 text-sm">${c.name}</h4><p class="text-xs text-slate-400 mt-0.5">Ref: ${c.ref || '-'}</p></div><span class="text-xl font-bold text-indigo-600">${c.current}<span class="text-sm text-gray-300 font-normal">/5</span></span></div><div class="relative pt-2 pb-1"><input type="range" min="1" max="5" value="${c.current}" oninput="updateScore('${e.id}', 'competencies', ${idx}, this.value)" class="w-full accent-indigo-600"><div class="flex justify-between text-[10px] text-gray-400 font-medium mt-1 uppercase tracking-wide"><span>Pemula</span><span>Mahir</span><span>Ahli</span></div></div></div>`).join('')}</div>`;
    }

    // --- 4. REPORT (CLEAN VIEW) ---

      const e = state.employees[state.selectedEmpId];
      const isApproved = e.approval.manager.date && e.approval.head.date;

      el.innerHTML = `
        <div class="pb-20 space-y-6">
           <div class="bg-white p-6 rounded-xl card-shadow text-center border border-slate-100">
              <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3">
                 <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              </div>
              <h2 class="text-lg font-bold text-slate-800 mb-1">Laporan Akhir Tahun</h2>
              <p class="text-xs text-slate-500 mb-6">Status Dokumen: ${isApproved ? '<span class="text-green-600 font-bold bg-green-50 px-2 py-1 rounded">DISETUJUI</span>' : '<span class="text-amber-500 font-bold bg-amber-50 px-2 py-1 rounded">DRAFT</span>'}</p>
              
              <button onclick="window.print()" class="w-full bg-slate-800 text-white py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-slate-200 active:scale-95 transition-transform">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                Cetak PDF (A4)
              </button>
           </div>

           <!-- Input Evaluasi (FIXED: Removed oninput re-render) -->
           <div class="bg-white p-5 rounded-xl card-shadow space-y-5">
              <div>
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Review Kinerja</label>
                <textarea id="input-review" class="w-full mt-2 p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors min-h-[100px]" placeholder="Tulis ulasan pencapaian...">${e.review}</textarea>
              </div>
              <div>
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Rencana Pengembangan</label>
                <textarea id="input-potential" class="w-full mt-2 p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors min-h-[100px]" placeholder="Tulis rencana pelatihan...">${e.potential}</textarea>
              </div>
           </div>

           <!-- Approval Actions -->
           <div class="bg-white p-5 rounded-xl card-shadow">
              <h3 class="font-bold text-slate-800 mb-4 text-sm">Persetujuan Digital</h3>
              <div class="space-y-3">
                 ${renderApproveBtn('manager', 'Manajer Koperasi', e)}
                 ${renderApproveBtn('head', 'Ketua Koperasi', e)}
              </div>
           </div>
        </div>
        
        <!-- Hidden Print Template -->
        ${renderPrintTemplate(e)}
      `;
      
      // Add Event Listeners manually to avoid re-render loop
      document.getElementById('input-review').addEventListener('input', (e) => {
          state.employees[state.selectedEmpId].review = e.target.value;
          saveState(); // Save but don't re-render whole app
      });
      document.getElementById('input-potential').addEventListener('input', (e) => {
          state.employees[state.selectedEmpId].potential = e.target.value;
          saveState();
      });

    function renderApproveBtn(role, label, e) {
        const date = e.approval[role].date;
        if (date) {
            return `<div class="flex items-center justify-between p-3 bg-green-50 rounded-xl border border-green-100 text-green-800"><span class="text-sm font-bold flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ${label}</span><div class="text-right"><div class="text-[10px] uppercase tracking-wide opacity-70">Disetujui</div><div class="text-xs font-mono font-bold">${new Date(date).toLocaleDateString('id-ID')}</div></div></div>`;
        }
        return `<button onclick="approve('${role}')" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 font-bold text-sm hover:bg-slate-50 hover:border-indigo-300 hover:text-indigo-600 transition-all active:scale-95">Tap to Approve (${label})</button>`;
    }

    // --- LOGIC ACTIONS ---
    function setTab(id) { state.activeTab = id; renderApp(); }
    function changeEmpGlobal(id) { state.selectedEmpId = id; renderApp(); }
    
    function updateScore(id, type, idx, val) { 
        state.employees[id][type][idx].current = parseInt(val); 
        localStorage.setItem('kopkarMobileVFinal2', JSON.stringify(state.employees)); 
        // No renderApp call to avoid slider jump
    }

    function updateKpiStatus(empId, idx, status) {
      if (status === false) {
        setTimeout(() => {
          Swal.fire({
            title: 'Target Tidak Tercapai', input: 'textarea', inputLabel: 'Jelaskan kendala:', inputPlaceholder: 'Contoh: Anggaran dipotong...', showCancelButton: true, confirmButtonText: 'Simpan', confirmButtonColor: '#ef4444'
          }).then((result) => {
            if (result.isConfirmed && result.value) { 
                state.employees[empId].kpis[idx].reason = result.value; 
                state.employees[empId].kpis[idx].status = status; 
                saveState(); 
                renderApp(); // Need re-render to show reason box
            }
          });
        }, 50);
      } else {
        state.employees[empId].kpis[idx].reason = ""; 
        state.employees[empId].kpis[idx].status = status; 
        saveState();
        renderApp();
      }
    }
    
    function approve(role) {
        Swal.fire({ title: 'Konfirmasi', text: "Setujui laporan ini secara digital?", icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Setujui', confirmButtonColor: '#10b981' }).then((result) => {
            if (result.isConfirmed) { 
                state.employees[state.selectedEmpId].approval[role].date = new Date().toISOString(); 
                saveState(); 
                renderApp();
            }
        })
    }

    function deleteItem(type, empId, idx) {
      if(confirm('Hapus item ini?')) {
        if(type === 'kpis') state.employees[empId].kpis.splice(idx, 1);
        // else if(type === 'competencies') state.employees[empId].competencies.splice(idx, 1);
        saveState();
        renderApp();
      }
    }

    // --- EVIDENCE ---
    function triggerUpload(empId, idx) {
        state.uploadContext = { empId, idx };
        document.getElementById('evidence-upload').click();
    }

    document.getElementById('evidence-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 1024 * 1024) { Swal.fire('Error', 'File terlalu besar (Max 1MB)', 'error'); return; }
        const reader = new FileReader();
        reader.onload = function(ev) {
            const { empId, idx } = state.uploadContext;
            state.employees[empId].kpis[idx].evidence = { type: file.type, data: ev.target.result };
            saveState();
            renderApp();
            Swal.fire('Berhasil', 'Bukti dukung tersimpan', 'success');
        };
        reader.readAsDataURL(file);
    });

    function viewEvidence(empId, idx) {
        const ev = state.employees[empId].kpis[idx].evidence;
        const content = document.getElementById('evidence-content');
        if (ev.type.startsWith('image/')) content.innerHTML = `<img src="${ev.data}" class="max-w-full max-h-full shadow-lg">`;
        else if (ev.type === 'application/pdf') content.innerHTML = `<iframe src="${ev.data}" class="w-full h-full"></iframe>`;
        document.getElementById('evidence-modal').classList.remove('hidden');
    }
    
    function deleteEvidence(empId, idx) {
        Swal.fire({ title: 'Hapus Bukti?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus', confirmButtonColor: '#ef4444' }).then((r) => {
            if(r.isConfirmed) { 
                state.employees[empId].kpis[idx].evidence = null; 
                saveState(); 
                renderApp();
            }
        });
    }

    // --- BACKUP/RESTORE ---
    function downloadBackup() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state.employees));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "backup_kopkar_akm_" + new Date().toISOString().slice(0,10) + ".json");
        document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();
    }

    function restoreBackup(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const newData = JSON.parse(e.target.result);
                if (newData.mahmudah) { 
                    state.employees = newData; 
                    saveState(); 
                    renderApp();
                    Swal.fire('Berhasil', 'Data dipulihkan', 'success'); 
                }
            } catch(err) { Swal.fire('Error', 'File rusak', 'error'); }
        };
        reader.readAsText(file);
    }

    // --- MODAL ---
    function openModal(type, empId = null, idx = null) {
        state.modalConfig = { type, empId, idx };
        const modal = document.getElementById('modal-backdrop');
        const panel = document.getElementById('modal-panel');
        const title = document.getElementById('modal-title');
        const body = document.getElementById('modal-body');
        
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); panel.classList.remove('translate-y-full'); }, 10);
        
        if(type === 'ADD_KPI') {
            title.innerText = 'Tambah KPI';
            body.innerHTML = `
                <input id="m-1" class="w-full p-3 bg-slate-100 rounded-xl mb-3" placeholder="Indikator">
                <input id="m-2" class="w-full p-3 bg-slate-100 rounded-xl mb-3" placeholder="Target">
                <select id="m-3" class="w-full p-3 bg-slate-100 rounded-xl mb-4"><option value="global">Global (Utama)</option><option value="detail">Detail (Aktivitas)</option></select>
                <button onclick="submitModal()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Simpan</button>
            `;
        } else if(type === 'EDIT_KPI') {
             const kpi = state.employees[empId].kpis[idx];
             title.innerText = 'Edit KPI';
             body.innerHTML = `
                <input id="m-1" class="w-full p-3 bg-slate-100 rounded-xl mb-3" value="${kpi.name}">
                <input id="m-2" class="w-full p-3 bg-slate-100 rounded-xl mb-3" value="${kpi.target}">
                <select id="m-3" class="w-full p-3 bg-slate-100 rounded-xl mb-4"><option value="global" ${kpi.type === 'global' ? 'selected' : ''}>Global (Utama)</option><option value="detail" ${kpi.type === 'detail' ? 'selected' : ''}>Detail (Aktivitas)</option></select>
                <button onclick="submitModal()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Update</button>
            `;
        } else {
            title.innerText = 'Tambah Kompetensi';
            body.innerHTML = `<input id="m-1" class="w-full p-3 bg-slate-100 rounded-xl mb-3" placeholder="Kompetensi"><input id="m-ref" class="w-full p-3 bg-slate-100 rounded-xl mb-3" placeholder="Ref SOP"><button onclick="submitModal()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Simpan</button>`;
        }
    }
    
    function closeModal() {
        const modal = document.getElementById('modal-backdrop');
        const panel = document.getElementById('modal-panel');
        modal.classList.add('opacity-0');
        panel.classList.add('translate-y-full');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    function submitModal() {
        const v1 = document.getElementById('m-1').value;
        const { type, empId, idx } = state.modalConfig;
        const targetEmpId = empId || state.selectedEmpId;

        if(type === 'ADD_KPI') {
            const v2 = document.getElementById('m-2').value;
            const v3 = document.getElementById('m-3').value;
            state.employees[targetEmpId].kpis.push({ type: v3, name: v1, target: v2, status: null, reason: '', evidence: null });
        } else if (type === 'EDIT_KPI') {
            const v2 = document.getElementById('m-2').value;
            const v3 = document.getElementById('m-3').value;
            state.employees[targetEmpId].kpis[idx].name = v1;
            state.employees[targetEmpId].kpis[idx].target = v2;
            state.employees[targetEmpId].kpis[idx].type = v3;
        }
        else {
            state.employees[targetEmpId].competencies.push({ name: v1, ref: document.getElementById('m-ref').value, target: 5, current: 0 });
        }
        closeModal(); 
        saveState();
        renderApp();
    }

    // --- PRINT TEMPLATE ---
    function renderPrintTemplate(emp) {
      const kpiOk = emp.kpis.filter(k=>k.status===true).length;
      const kpiScore = emp.kpis.length > 0 ? Math.round((kpiOk/emp.kpis.length)*100) : 0;
      const date = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
      return `<div id="printable-report" class="print-only bg-white"><div class="text-center border-b-2 border-black pb-4 mb-6"><h1 class="uppercase font-bold text-xl tracking-wide">KOPERASI KARYAWAN ADARO KARYA MANDIRI</h1><h2 class="text-lg">LAPORAN AKUNTABILITAS KINERJA TAHUNAN</h2><p class="text-sm">Tahun Buku: ${new Date().getFullYear()}</p></div><table class="w-full mb-6 text-sm"><tr><td class="w-32 font-bold py-1">Nama</td><td>: ${emp.name}</td><td class="w-32 font-bold">Periode</td><td>: Jan - Des 2025</td></tr><tr><td class="font-bold py-1">Jabatan</td><td>: ${emp.role}</td><td class="font-bold">ID Karyawan</td><td>: ${emp.id.toUpperCase()}</td></tr></table><div class="mb-6"><h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">I. PENCAPAIAN KPI (JOB GOALS)</h3><div class="text-sm mb-2 font-bold">Skor Capaian: ${kpiScore}% (${kpiOk}/${emp.kpis.length})</div><table class="w-full text-xs border-collapse border border-black"><tr class="bg-gray-100"><th class="border border-black p-1 text-left w-1/3">Indikator</th><th class="border border-black p-1 text-left w-1/4">Target</th><th class="border border-black p-1 text-center w-1/6">Status</th><th class="border border-black p-1 text-left w-1/4">Kendala / Bukti</th></tr>${emp.kpis.map(k => `<tr><td class="border border-black p-1">${k.name} ${k.type==='global'?'<b style="color:blue">(Utama)</b>':''}</td><td class="border border-black p-1">${k.target}</td><td class="border border-black p-1 text-center font-bold">${k.status===true?'TERCAPAI':(k.status===false?'GAGAL':'-')}</td><td class="border border-black p-1 italic text-xs">${k.status===false ? (k.reason || '-') : (k.evidence ? '[Bukti Terlampir]' : '-')}</td></tr>`).join('')}</table></div><div class="mb-6"><h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">II. EVALUASI KOMPETENSI (SOP)</h3><table class="w-full text-xs border-collapse border border-black"><tr class="bg-gray-100"><th class="border border-black p-1 text-left">Kompetensi</th><th class="border border-black p-1 text-left w-1/4">Ref SOP</th><th class="border border-black p-1 text-center w-12">Target</th><th class="border border-black p-1 text-center w-12">Aktual</th></tr>${emp.competencies.map(c => `<tr><td class="border border-black p-1 font-bold">${c.name}</td><td class="border border-black p-1 italic">${c.ref}</td><td class="border border-black p-1 text-center">${c.target}</td><td class="border border-black p-1 text-center font-bold">${c.current}</td></tr>`).join('')}</table></div><div class="mb-8"><h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">III. ULASAN & PENGEMBANGAN</h3><div class="border border-black p-2 mb-2 min-h-[60px] text-xs"><b class="block mb-1">ULASAN:</b>${emp.review || '-'}</div><div class="border border-black p-2 min-h-[60px] text-xs"><b class="block mb-1">PENGEMBANGAN:</b>${emp.potential || '-'}</div></div><div class="flex justify-between mt-8 px-8 page-break-inside-avoid text-xs"><div class="text-center w-1/3"><p class="mb-12">Manajer Koperasi</p>${emp.approval.manager.date ? `<div class="border border-green-600 text-green-700 font-bold p-1 mb-1">DIGITALLY SIGNED<br>${new Date(emp.approval.manager.date).toLocaleDateString('id-ID')}</div>` : ''}<p class="font-bold underline">( ................................. )</p></div><div class="text-center w-1/3"><p class="mb-12">Ketua Pengurus</p>${emp.approval.head.date ? `<div class="border border-green-600 text-green-700 font-bold p-1 mb-1">DIGITALLY SIGNED<br>${new Date(emp.approval.head.date).toLocaleDateString('id-ID')}</div>` : ''}<p class="font-bold underline">( ................................. )</p></div></div><p class="text-center text-[10px] mt-6 italic">Dicetak pada ${date}</p></div>`;
    }

    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
