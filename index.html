<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kopkar AKM">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 untuk Popup Alasan yang Cantik -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
    
    /* Mobile Optimizations */
    .touch-target { min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; }
    .card-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    /* Bottom Navigation */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; background: white;
      border-top: 1px solid #e5e7eb; padding-bottom: env(safe-area-inset-bottom);
      display: flex; justify-content: space-around; z-index: 50;
    }
    .nav-item {
      flex: 1; text-align: center; padding: 10px 0; color: #9ca3af; font-size: 10px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .nav-item.active { color: #4f46e5; }
    .nav-item svg { width: 24px; height: 24px; }

    /* Range Slider */
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; padding: 10px 0; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #4f46e5; cursor: pointer; margin-top: -10px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #d1d5db; border-radius: 3px; }

    /* Print Layout */
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background-color: white; padding-bottom: 0; }
      .no-print, .bottom-nav { display: none !important; }
      .print-only { display: block !important; }
      .page-break { page-break-before: always; }
      h1 { font-size: 20px !important; margin-bottom: 10px; }
      p, td, th { font-size: 10px !important; color: #000 !important; }
      .print-border { border: 1px solid #000 !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="text-slate-800 select-none">

  <!-- Header Mobile -->
  <header class="bg-white shadow-sm sticky top-0 z-40 no-print pt-safe-top">
    <div class="px-4 h-16 flex justify-between items-center">

        </div>

          <h1 class="text-lg font-bold text-slate-900 leading-tight">Kopkar AKM</h1>

      <!-- Employee Selector -->
      <select id="global-emp-select" onchange="changeEmpGlobal(this.value)" class="bg-slate-100 border-none rounded-lg py-1.5 px-3 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-500 w-40 truncate">
          <!-- Options injected by JS -->

    </div>
  </header>

  <!-- Main Content -->
  <main class="px-4 py-4 min-h-screen" id="app-content">
    <!-- Content injected here -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav no-print" id="bottom-nav">
    <!-- Nav items injected by JS -->
  </nav>

  <!-- Mobile Bottom Sheet Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-[60] flex items-end sm:items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="bg-white w-full sm:max-w-md sm:rounded-xl rounded-t-2xl shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[90vh] overflow-y-auto" id="modal-panel">
      <div class="sticky top-0 bg-white z-10 px-4 py-3 border-b flex justify-between items-center rounded-t-2xl">
        <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto absolute left-0 right-0 top-2"></div>
        <h3 class="text-lg font-bold text-slate-900 mt-2" id="modal-title">Judul</h3>
        <button onclick="closeModal()" class="text-slate-400 p-2 mt-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>

      ];

          <span>${t.label}</span>
        </button>
      `).join('');

      const sel = document.getElementById('global-emp-select');
      if(sel.options.length === 0) {
          sel.innerHTML = Object.values(state.employees).map(e => `<option value="${e.id}">${e.name}</option>`).join('');
      }
      sel.value = state.selectedEmpId;
    }

    function renderApp() {
      renderNav();
      const content = document.getElementById('app-content');
      
      if (state.activeTab === 'dashboard') renderDashboard(content);
      else if (state.activeTab === 'competency') renderCompetency(content);
      else if (state.activeTab === 'kpi') renderKPI(content);
      else if (state.activeTab === 'report') renderReport(content);
    }

    // --- 1. DASHBOARD (MOBILE CARD) ---
    function renderDashboard(el) {
      const e = state.employees[state.selectedEmpId];
      const kpiOk = e.kpis.filter(k => k.status === true).length;
      const pct = Math.round((kpiOk / e.kpis.length) * 100);
      
      const emps = Object.values(state.employees);
      const approvedCount = emps.filter(emp => emp.approval.manager.date).length;

      el.innerHTML = `

          <!-- Welcome Card -->
          <div class="bg-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-indigo-200">
            <div class="flex justify-between items-start">

                    <p class="opacity-80 text-xs mb-1 font-medium uppercase tracking-wider">Performance Dashboard</p>

                </div>

                </div>
            </div>
            
            <div class="mt-2">
                <div class="flex justify-between text-xs opacity-80 mb-1">

                </div>
                <div class="w-full bg-indigo-800 rounded-full h-1.5">

               <p class="text-xs text-gray-400 uppercase font-bold mb-1">Status Tim</p>
               <p class="text-sm font-bold text-green-600">${approvedCount} / ${emps.length} Laporan OK</p> 
            </div>
          </div>

          <!-- Career Focus -->

            <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2 text-sm">
              <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>

          </div>
        </div>
      `;
    }

    // --- 2. KPI (TOUCH FRIENDLY & REASON POPUP) ---
    function renderKPI(el) {
      const e = state.employees[state.selectedEmpId];
      el.innerHTML = `

                <div class="flex justify-between items-start">

                </div>
                <div class="mt-1 text-xs text-slate-500 bg-slate-50 inline-block px-2 py-1 rounded border border-slate-100">Target: ${k.target}</div>
              </div>
              
              <!-- Action Row -->
              <div class="flex items-center justify-end gap-3 mt-4 pt-3 border-t border-slate-100">
                 <div class="text-xs text-gray-400 mr-auto self-center">Tap status:</div>
                 <button onclick="updateKpiStatus('${e.id}', ${idx}, false)" class="touch-target w-10 h-10 rounded-full border border-slate-200 ${k.status === false ? 'bg-red-500 text-white border-red-500 shadow-md shadow-red-200' : 'bg-white text-slate-400 hover:bg-red-50'}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>

                 <button onclick="updateKpiStatus('${e.id}', ${idx}, true)" class="touch-target w-10 h-10 rounded-full border border-slate-200 ${k.status === true ? 'bg-green-500 text-white border-green-500 shadow-md shadow-green-200' : 'bg-white text-slate-400 hover:bg-green-50'}">

                 </button>
              </div>
              ${k.status === false && k.reason ? `
                <div class="mt-3 p-3 bg-red-50 border border-red-100 rounded-lg">
                    <p class="text-[10px] font-bold text-red-400 uppercase mb-1">Kendala / Alasan:</p>
                    <p class="text-xs text-red-800 italic">"${k.reason}"</p>
                </div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    // --- 3. COMPETENCY (SLIDER UI) ---

          </div>
          ${e.competencies.map((c, idx) => `
            <div class="bg-white p-5 rounded-xl card-shadow">

                   <h4 class="font-bold text-slate-800 text-sm">${c.name}</h4>

              <div class="relative pt-2 pb-1">
                 <input type="range" min="1" max="5" value="${c.current}" oninput="updateScore('${e.id}', 'competencies', ${idx}, this.value)" class="w-full accent-indigo-600">
                 <div class="flex justify-between text-[10px] text-gray-400 font-medium mt-1 uppercase tracking-wide">
                    <span>Pemula</span>
                    <span>Mahir</span>
                    <span>Ahli</span>
                 </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // --- 4. REPORT (CLEAN VIEW) ---
    function renderReport(el) {
      const e = state.employees[state.selectedEmpId];
      const isApproved = e.approval.manager.date && e.approval.head.date;

      el.innerHTML = `
        <div class="pb-20 space-y-6">
           <div class="bg-white p-6 rounded-xl card-shadow text-center border border-slate-100">
              <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3">
                 <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              </div>
              <h2 class="text-lg font-bold text-slate-800 mb-1">Laporan Akhir Tahun</h2>
              <p class="text-xs text-slate-500 mb-6">Status Dokumen: ${isApproved ? '<span class="text-green-600 font-bold bg-green-50 px-2 py-1 rounded">DISETUJUI</span>' : '<span class="text-amber-500 font-bold bg-amber-50 px-2 py-1 rounded">DRAFT</span>'}</p>
              
              <button onclick="window.print()" class="w-full bg-slate-800 text-white py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-slate-200 active:scale-95 transition-transform">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                Cetak PDF (A4)
              </button>
           </div>

           <!-- Input Evaluasi -->
           <div class="bg-white p-5 rounded-xl card-shadow space-y-5">
              <div>
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Review Kinerja</label>
                <textarea oninput="updateText('review', this.value)" class="w-full mt-2 p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors min-h-[100px]" placeholder="Tulis ulasan pencapaian...">${e.review}</textarea>
              </div>
              <div>
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Rencana Pengembangan</label>
                <textarea oninput="updateText('potential', this.value)" class="w-full mt-2 p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-colors min-h-[100px]" placeholder="Tulis rencana pelatihan...">${e.potential}</textarea>
              </div>
           </div>

           <!-- Approval Actions -->
           <div class="bg-white p-5 rounded-xl card-shadow">
              <h3 class="font-bold text-slate-800 mb-4 text-sm">Persetujuan Digital</h3>
              <div class="space-y-3">
                 ${renderApproveBtn('manager', 'Manajer Koperasi', e)}
                 ${renderApproveBtn('head', 'Ketua Koperasi', e)}
              </div>
           </div>
        </div>
        
        <!-- Hidden Print Template -->
        ${renderPrintTemplate(e)}
      `;
    }

    function renderApproveBtn(role, label, e) {
        const date = e.approval[role].date;
        if (date) {
            return `<div class="flex items-center justify-between p-3 bg-green-50 rounded-xl border border-green-100 text-green-800">
                <span class="text-sm font-bold flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ${label}</span>
                <div class="text-right">
                    <div class="text-[10px] uppercase tracking-wide opacity-70">Disetujui</div>
                    <div class="text-xs font-mono font-bold">${new Date(date).toLocaleDateString('id-ID')}</div>
                </div>
            </div>`;
        }
        return `<button onclick="approve('${role}')" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 font-bold text-sm hover:bg-slate-50 hover:border-indigo-300 hover:text-indigo-600 transition-all active:scale-95">
            Tap to Approve (${label})
        </button>`;
    }

    // --- LOGIC ACTIONS ---
    function setTab(id) { state.activeTab = id; saveState(); }
    function changeEmpGlobal(id) { state.selectedEmpId = id; saveState(); }
    function updateScore(id, type, idx, val) { state.employees[id][type][idx].current = parseInt(val); saveState(); }
    function updateText(field, val) { state.employees[state.selectedEmpId][field] = val; saveState(); }
    
    function updateKpiStatus(empId, idx, status) {
      if (status === false) {
        // FIX: Use setTimeout to prevent browser blocking UI update
        setTimeout(() => {
          Swal.fire({
            title: 'Target Tidak Tercapai',
            input: 'textarea',
            inputLabel: 'Jelaskan kendala atau alasan:',
            inputPlaceholder: 'Contoh: Anggaran dipotong / Cuaca buruk...',
            showCancelButton: true,
            confirmButtonText: 'Simpan',
            confirmButtonColor: '#ef4444',
            cancelButtonText: 'Batal'
          }).then((result) => {
            if (result.isConfirmed && result.value) {
               state.employees[empId].kpis[idx].reason = result.value;
               state.employees[empId].kpis[idx].status = status;
               saveState();
            }
          });
        }, 50);
      } else {
        state.employees[empId].kpis[idx].reason = ""; 
        state.employees[empId].kpis[idx].status = status;
        saveState();
      }
    }
    
    // --- MODAL LOGIC ---
    function openModal(type) {
        const e = state.employees[state.selectedEmpId];
        const title = document.getElementById('modal-title');
        const body = document.getElementById('modal-body');
        const modal = document.getElementById('modal-backdrop');
        const panel = document.getElementById('modal-panel');

        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); panel.classList.remove('translate-y-full'); }, 10);

        if (type === 'ADD_KPI') {
            title.innerText = 'Tambah KPI';
            body.innerHTML = `
                <input id="m-1" class="w-full p-3 bg-slate-100 rounded-xl mb-3 text-sm" placeholder="Nama Indikator">
                <input id="m-2" class="w-full p-3 bg-slate-100 rounded-xl mb-4 text-sm" placeholder="Target (Rp/Jml)">
                <button onclick="submitModal('${type}')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-200">Simpan Data</button>
            `;
        } else if (type === 'ADD_COMP') {
            title.innerText = 'Tambah Kompetensi';
            body.innerHTML = `
                <input id="m-1" class="w-full p-3 bg-slate-100 rounded-xl mb-3 text-sm" placeholder="Nama Kompetensi">
                <input id="m-ref" class="w-full p-3 bg-slate-100 rounded-xl mb-3 text-sm" placeholder="Referensi SOP">
                <button onclick="submitModal('${type}')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-indigo-200">Simpan Data</button>
            `;
        }
    }

    function closeModal() {
        const modal = document.getElementById('modal-backdrop');
        const panel = document.getElementById('modal-panel');
        modal.classList.add('opacity-0');
        panel.classList.add('translate-y-full');
        setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    function submitModal(type) {
        const empId = state.selectedEmpId;
        const v1 = document.getElementById('m-1').value;
        
        if(type === 'ADD_KPI') {
            const v2 = document.getElementById('m-2').value;
            state.employees[empId].kpis.push({ name: v1, target: v2, status: null, reason: '' });
        } else {
             const vRef = document.getElementById('m-ref').value;
             state.employees[empId].competencies.push({ name: v1, ref: vRef, target: 5, current: 0 });
        }
        closeModal();
        saveState();
    }

    function approve(role) {
        Swal.fire({
            title: 'Konfirmasi', text: "Setujui laporan ini secara digital?", icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Setujui', confirmButtonColor: '#10b981'
        }).then((result) => {
            if (result.isConfirmed) {
                state.employees[state.selectedEmpId].approval[role].date = new Date().toISOString();
                saveState();
            }
        })
    }

    // --- TEMPLATE CETAK PDF (FINAL) ---
    function renderPrintTemplate(emp) {
      const kpiOk = emp.kpis.filter(k=>k.status===true).length;
      const kpiScore = emp.kpis.length > 0 ? Math.round((kpiOk/emp.kpis.length)*100) : 0;
      const date = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
      
      return `
      <div id="printable-report" class="print-only bg-white">
        <div class="text-center border-b-2 border-black pb-4 mb-6">
          <h1 class="uppercase font-bold text-xl tracking-wide">KOPERASI KARYAWAN ADARO KARYA MANDIRI</h1>
          <h2 class="text-lg">LAPORAN AKUNTABILITAS KINERJA 2025</h2>
        </div>
        <!-- Tabel Identitas -->
        <table class="w-full mb-6 text-sm">
            <tr><td class="w-32 font-bold py-1">Nama</td><td>: ${emp.name}</td><td class="w-32 font-bold">Periode</td><td>: Jan - Des 2025</td></tr>
            <tr><td class="font-bold py-1">Jabatan</td><td>: ${emp.role}</td><td class="font-bold">ID Karyawan</td><td>: ${emp.id.toUpperCase()}</td></tr>
        </table>
        <!-- Tabel KPI -->
        <div class="mb-6">
            <h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">I. PENCAPAIAN KPI (JOB GOALS)</h3>
            <div class="text-xs mb-2 font-bold">Skor Capaian: ${kpiScore}% (${kpiOk}/${emp.kpis.length})</div>
            <table class="w-full text-xs border-collapse border border-black">
                <tr class="bg-gray-100">
                    <th class="border border-black p-1 text-left w-1/3">Indikator</th>
                    <th class="border border-black p-1 text-left w-1/4">Target</th>
                    <th class="border border-black p-1 text-center w-1/6">Status</th>
                    <th class="border border-black p-1 text-left w-1/4">Keterangan / Kendala</th>
                </tr>
                ${emp.kpis.map(k => `
                <tr>
                    <td class="border border-black p-1">${k.name}</td>
                    <td class="border border-black p-1">${k.target}</td>
                    <td class="border border-black p-1 text-center font-bold">${k.status===true?'TERCAPAI':(k.status===false?'GAGAL':'-')}</td>
                    <td class="border border-black p-1 italic text-red-600">${k.status===false ? (k.reason || '-') : '-'}</td>
                </tr>`).join('')}
            </table>
        </div>
        <!-- Tabel Kompetensi -->
        <div class="mb-6">
            <h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">II. EVALUASI KOMPETENSI (SOP)</h3>
            <table class="w-full text-xs border-collapse border border-black">
                <tr class="bg-gray-100">
                    <th class="border border-black p-1 text-left">Kompetensi</th>
                    <th class="border border-black p-1 text-left w-1/4">Ref SOP</th>
                    <th class="border border-black p-1 text-center w-12">Target</th>
                    <th class="border border-black p-1 text-center w-12">Aktual</th>
                </tr>
                ${emp.competencies.map(c => `
                <tr>
                    <td class="border border-black p-1 font-bold">${c.name}</td>
                    <td class="border border-black p-1 italic">${c.ref}</td>
                    <td class="border border-black p-1 text-center">${c.target}</td>
                    <td class="border border-black p-1 text-center font-bold">${c.current}</td>
                </tr>`).join('')}
            </table>
        </div>
        <!-- Ulasan -->
        <div class="mb-8">
            <h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">III. ULASAN & PENGEMBANGAN</h3>
            <div class="border border-black p-2 mb-2 min-h-[60px] text-xs"><b class="block mb-1">ULASAN:</b>${emp.review || '-'}</div>
            <div class="border border-black p-2 min-h-[60px] text-xs"><b class="block mb-1">PENGEMBANGAN:</b>${emp.potential || '-'}</div>
        </div>
        <!-- TTD -->
        <div class="flex justify-between mt-8 px-8 page-break-inside-avoid text-xs">
            <div class="text-center w-1/3">
                <p class="mb-12">Manajer Koperasi</p>
                ${emp.approval.manager.date ? `<div class="border border-green-600 text-green-700 font-bold p-1 mb-1">DIGITALLY SIGNED<br>${new Date(emp.approval.manager.date).toLocaleDateString('id-ID')}</div>` : ''}
                <p class="font-bold underline">( ................................. )</p>
            </div>
            <div class="text-center w-1/3">
                <p class="mb-12">Ketua Pengurus</p>
                ${emp.approval.head.date ? `<div class="border border-green-600 text-green-700 font-bold p-1 mb-1">DIGITALLY SIGNED<br>${new Date(emp.approval.head.date).toLocaleDateString('id-ID')}</div>` : ''}
                <p class="font-bold underline">( ................................. )</p>
            </div>
        </div>
        <p class="text-center text-[10px] mt-6 italic">Dicetak pada ${date}</p>
      </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
