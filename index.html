    /* UI Elements */

    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }

    /* Print Layout (A4 Standard) */
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background-color: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .page-break { page-break-before: always; }
      
      /* Typography for Print */
      h1 { font-size: 24px !important; margin-bottom: 10px; }
      h2 { font-size: 18px !important; margin-bottom: 20px; }
      p, td, th { font-size: 11px !important; color: #000 !important; }
      
      /* Borders for Print */
      .print-border { border: 1px solid #000 !important; }
      .print-border-b { border-bottom: 1px solid #000 !important; }
    }
    .print-only { display: none; }
  </style>
</head>

        },
        review: "", potential: "",
        approval: { manager: {date: null}, head: {date: null} }
      }
    };

    // --- STATE & LOGIC ---
    let state = {
      employees: JSON.parse(localStorage.getItem('kopkarDB_Final_V4')) || initialEmployees,
      activeTab: 'report',
      selectedEmpId: 'sri',
      isModalOpen: false,
      modalConfig: null
    };

    const saveState = () => {
      localStorage.setItem('kopkarDB_Final_V4', JSON.stringify(state.employees));
      renderApp();
    };

    // --- RENDERER ---
    function renderTabs() {
      const tabs = [
        { id: 'dashboard', label: 'Dashboard', icon: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z' },
        { id: 'competency', label: 'Kompetensi (SOP)', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' },
        { id: 'kpi', label: 'KPI (Renstra)', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
        { id: 'career', label: 'Career Path', icon: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' },
        { id: 'report', label: 'Laporan Akuntabilitas', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' }
      ];
      const navTabs = document.getElementById('nav-tabs');
      if(navTabs) {
        navTabs.innerHTML = tabs.map(t => `
          <button onclick="setTab('${t.id}')" class="tab-btn flex items-center gap-2 px-4 py-3 text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors whitespace-nowrap ${state.activeTab === t.id ? 'active' : ''}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg> ${t.label}
          </button>`).join('');
      }
    }

    function renderApp() {
      renderTabs();
      const content = document.getElementById('app-content');
      if (!content) return;
      
      if (state.activeTab === 'dashboard') renderDashboard(content);
      else if (state.activeTab === 'competency') renderCompetency(content);
      else if (state.activeTab === 'kpi') renderKPI(content);
      else if (state.activeTab === 'career') renderCareer(content);
      else if (state.activeTab === 'report') renderReport(content);
    }

    // 1. DASHBOARD
    function renderDashboard(el) {
      const emps = Object.values(state.employees);
      el.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-slate-500 text-sm font-medium uppercase">Total Karyawan Inti</h3>
            <p class="text-3xl font-bold text-slate-900 mt-2">${emps.length} <span class="text-sm font-normal text-slate-500">Orang</span></p>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-slate-500 text-sm font-medium uppercase">Kesiapan Laporan</h3>
            <p class="text-3xl font-bold text-emerald-600 mt-2">${emps.filter(e => e.approval.manager.date).length} <span class="text-sm font-normal text-slate-500">Disetujui Manajer</span></p>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 class="text-slate-500 text-sm font-medium uppercase">Basis Data</h3>
            <p class="text-lg font-bold text-indigo-600 mt-2">Job Goals 2025 & Activity Plan</p>
          </div>
        </div>
        <h3 class="text-lg font-bold text-slate-900 mb-4">Status Kinerja Tim</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          ${emps.map(e => {
            const kpiOk = e.kpis.filter(k => k.status === true).length;
            const pct = Math.round((kpiOk / e.kpis.length) * 100);
            return `
            <div onclick="setTab('report', '${e.id}')" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 hover:border-indigo-400 cursor-pointer transition-all group">
              <div class="flex items-center gap-4 mb-4">
                <img src="${e.photo}" class="w-12 h-12 rounded-full bg-slate-100">
                <div>
                  <h4 class="font-bold text-slate-900 group-hover:text-indigo-600">${e.name}</h4>
                  <p class="text-xs text-slate-500">${e.role}</p>
                </div>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-2 mb-2">
                <div class="bg-indigo-600 h-2 rounded-full" style="width: ${pct}%"></div>
              </div>
              <div class="flex justify-between text-xs text-slate-500">
                <span>KPI: ${pct}% Tercapai</span>
                <span>${e.kpis.length} Indikator</span>
              </div>
            </div>`;
          }).join('')}
        </div>`;
    }

          Panduan Penilaian
        </button>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        ${Object.values(state.employees).map(e => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-start mb-6">
              <div class="flex items-center gap-3">
                <img src="${e.photo}" class="w-10 h-10 rounded-full">
                <div>

            <div class="space-y-5">

                  </div>
                  <div class="flex justify-between text-xs text-slate-400 mb-1 italic">
                    <span>Ref: ${c.ref || 'General'}</span>
                    <button onclick="deleteItem('competencies', '${e.id}', ${idx})" class="text-red-400 hover:text-red-600 not-italic">Hapus</button>

                  <input type="range" min="1" max="5" value="${c.current}" oninput="updateScore('${e.id}', 'competencies', ${idx}, this.value)">

        ${Object.values(state.employees).map(e => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-start mb-6">
              <div class="flex items-center gap-3">
                <img src="${e.photo}" class="w-10 h-10 rounded-full">
                <div>
                  <h3 class="font-bold text-slate-900">${e.name}</h3>
                  <p class="text-xs text-slate-500">${e.role}</p>
                </div>
              </div>
              <button onclick="openModal('ADD_KPI', '${e.id}')" class="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded hover:bg-indigo-100 font-medium">+ Tambah</button>

            <div class="space-y-3">
              ${e.kpis.map((k, idx) => `
                <div class="p-3 border border-slate-100 rounded-lg hover:bg-slate-50 transition-colors">
                  <div class="flex items-center justify-between">
                    <div class="flex-1">
                        <p class="text-sm font-medium text-slate-800">${k.name}</p>
                        <p class="text-xs text-slate-500 mt-0.5">Target: ${k.target}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateKpiStatus('${e.id}', ${idx}, true)" class="p-1.5 rounded ${k.status === true ? 'bg-green-100 text-green-700' : 'text-slate-300 hover:bg-slate-100'}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></button>
                        <button onclick="updateKpiStatus('${e.id}', ${idx}, false)" class="p-1.5 rounded ${k.status === false ? 'bg-red-100 text-red-700' : 'text-slate-300 hover:bg-slate-100'}"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
                        <button onclick="deleteItem('kpis', '${e.id}', ${idx})" class="text-slate-300 hover:text-red-500 ml-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                    </div>
                  </div>
                  ${k.status === false && k.reason ? `<div class="mt-2 p-2 bg-red-50 border border-red-100 rounded text-xs text-red-700"><strong>Kendala:</strong> ${k.reason}</div>` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>`;
    }

    // 4. CAREER PATH
    function renderCareer(el) {
      el.innerHTML = `<h2 class="text-xl font-bold mb-6">Rencana Karir (Akuntabel)</h2>
      <div class="space-y-6">
        ${Object.values(state.employees).map(e => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-3">
              <img src="${e.photo}" class="w-8 h-8 rounded-full"> ${e.name}
            </h3>
            <div class="grid md:grid-cols-3 gap-4">
              <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                <div class="text-xs font-bold text-blue-700 uppercase mb-2 tracking-wider">Jangka Pendek (1-2 Th)</div>
                <ul class="text-sm text-slate-700 list-disc pl-4 space-y-1">${e.careerPath.short.map(i=>`<li>${i}</li>`).join('')}</ul>
              </div>
              <div class="bg-amber-50 p-4 rounded-lg border border-amber-100">
                <div class="text-xs font-bold text-amber-700 uppercase mb-2 tracking-wider">Jangka Menengah (3-5 Th)</div>
                <ul class="text-sm text-slate-700 list-disc pl-4 space-y-1">${e.careerPath.mid.map(i=>`<li>${i}</li>`).join('')}</ul>
              </div>
              <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-100">
                <div class="text-xs font-bold text-emerald-700 uppercase mb-2 tracking-wider">Jangka Panjang (5+ Th)</div>
                <ul class="text-sm text-slate-700 list-disc pl-4 space-y-1">${e.careerPath.long.map(i=>`<li>${i}</li>`).join('')}</ul>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`;
    }

    // 5. REPORT (AKUNTABILITAS)
    function renderReport(el) {
      const emp = state.employees[state.selectedEmpId];
      const kpiOk = emp.kpis.filter(k=>k.status===true).length;
      const kpiScore = Math.round((kpiOk/emp.kpis.length)*100) || 0;

      el.innerHTML = `
        <div class="flex flex-col lg:flex-row gap-6 no-print">
          <!-- Sidebar Control -->
          <div class="lg:w-1/4 space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Pilih Karyawan</label>
              <select onchange="changeEmp(this.value)" class="w-full border-slate-300 rounded-lg shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                ${Object.values(state.employees).map(e => `<option value="${e.id}" ${e.id===state.selectedEmpId?'selected':''}>${e.name}</option>`).join('')}
              </select>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 text-center">
              <h3 class="text-sm font-medium text-slate-600 mb-2">Skor KPI (Job Goals)</h3>
              <div class="text-4xl font-bold text-indigo-600 mb-1">${kpiScore}%</div>
              <p class="text-xs text-slate-400">Target: ${emp.kpis.length} Indikator</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Aksi</label>
              <button onclick="window.print()" class="w-full flex items-center justify-center gap-2 bg-slate-800 text-white px-4 py-2.5 rounded-lg hover:bg-slate-900 transition-colors mb-3">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                Cetak PDF (A4)
              </button>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="approve('manager')" class="text-xs px-3 py-2 rounded border ${emp.approval.manager.date ? 'bg-green-50 text-green-700 border-green-200' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}">
                  ${emp.approval.manager.date ? 'ACC Manajer' : 'Approve Mgr'}
                </button>
                <button onclick="approve('head')" class="text-xs px-3 py-2 rounded border ${emp.approval.head.date ? 'bg-green-50 text-green-700 border-green-200' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}">
                  ${emp.approval.head.date ? 'ACC Ketua' : 'Approve Ketua'}
                </button>
              </div>
            </div>
          </div>

          <!-- Main Form -->
          <div class="lg:w-3/4 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 mb-6 pb-4 border-b border-slate-100">Input Evaluasi Tahunan</h2>
            <div class="space-y-6">
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Ulasan Pencapaian Target (Kualitatif)</label>
                <p class="text-xs text-slate-500 mb-2">Jelaskan kendala atau keberhasilan berdasarkan Job Goals & SOP.</p>
                <textarea oninput="updateText('review', this.value)" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" rows="4">${emp.review}</textarea>
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Potensi Pengembangan Diri</label>
                <p class="text-xs text-slate-500 mb-2">Rekomendasi pelatihan berdasarkan Gap Kompetensi.</p>
                <textarea oninput="updateText('potential', this.value)" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" rows="4">${emp.potential}</textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- PRINT TEMPLATE (HIDDEN) -->
        ${renderPrintTemplate(emp, kpiOk, kpiScore)}
      `;
    }

    function renderPrintTemplate(emp, kpiOk, kpiScore) {
      const date = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
      return `
      <div id="print-container" class="print-only bg-white">
        <div class="text-center border-b-2 border-black pb-4 mb-6">
          <h1 class="uppercase font-bold text-2xl tracking-wide">KOPERASI KARYAWAN ADARO KARYA MANDIRI</h1>
          <h2 class="text-lg">LAPORAN AKUNTABILITAS KINERJA TAHUNAN</h2>
          <p class="text-sm">Tahun Buku: ${new Date().getFullYear()}</p>
        </div>

        <table class="w-full mb-6">
          <tr><td class="w-32 font-bold">Nama</td><td>: ${emp.name}</td><td class="w-32 font-bold">Periode</td><td>: Jan - Des ${new Date().getFullYear()}</td></tr>
          <tr><td class="font-bold">Jabatan</td><td>: ${emp.role}</td><td class="font-bold">ID Karyawan</td><td>: ${emp.id.toUpperCase()}</td></tr>
        </table>

        <div class="mb-6">
          <h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">I. PENCAPAIAN KPI (JOB GOALS 2025)</h3>
          <div class="mb-2 font-bold text-sm">Skor Capaian: ${kpiScore}% (${kpiOk} dari ${emp.kpis.length} Target)</div>
          <table class="w-full text-sm border-collapse border border-black">
            <tr class="bg-gray-100"><th class="border border-black p-2 text-left w-1/3">Indikator Kinerja Utama</th><th class="border border-black p-2 text-left w-1/4">Target</th><th class="border border-black p-2 text-center w-1/6">Status</th><th class="border border-black p-2 text-left w-1/4">Keterangan / Kendala</th></tr>
            ${emp.kpis.map(k => `<tr><td class="border border-black p-2">${k.name}</td><td class="border border-black p-2">${k.target}</td><td class="border border-black p-2 text-center font-bold">${k.status===true?'TERCAPAI':(k.status===false?'TDK TERCAPAI':'-')}</td><td class="border border-black p-2 italic text-xs">${k.status===false ? (k.reason || '-') : '-'}</td></tr>`).join('')}
          </table>
        </div>

        <div class="mb-6">
          <h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">II. EVALUASI KOMPETENSI (BERBASIS SOP)</h3>
          <table class="w-full text-sm border-collapse border border-black">
            <tr class="bg-gray-100"><th class="border border-black p-2 text-left">Kompetensi & Referensi SOP</th><th class="border border-black p-2 text-center w-16">Target</th><th class="border border-black p-2 text-center w-16">Aktual</th><th class="border border-black p-2 text-center w-20">Gap</th></tr>
            ${emp.competencies.map(c => {
              const gap = c.target - c.current;
              return `<tr><td class="border border-black p-2"><b>${c.name}</b><br><span class="text-xs italic">Ref: ${c.ref}</span></td><td class="border border-black p-2 text-center">${c.target}</td><td class="border border-black p-2 text-center">${c.current}</td><td class="border border-black p-2 text-center">${gap>0?`-${gap}`:'OK'}</td></tr>`;
            }).join('')}
          </table>
        </div>

        <div class="mb-8">
          <h3 class="font-bold uppercase text-sm border-b border-black mb-2 pb-1">III. ULASAN & RENCANA PENGEMBANGAN</h3>
          <div class="border border-black p-3 mb-2 min-h-[80px]">
            <b class="text-xs block mb-1">ULASAN MANAJEMEN:</b>
            <p class="text-sm whitespace-pre-wrap">${emp.review || '-'}</p>
          </div>
          <div class="border border-black p-3 min-h-[80px]">
            <b class="text-xs block mb-1">RENCANA PENGEMBANGAN:</b>
            <p class="text-sm whitespace-pre-wrap">${emp.potential || '-'}</p>
          </div>
        </div>

        <div class="flex justify-between mt-12 px-8 page-break-inside-avoid">
          <div class="text-center w-1/3">
            <p class="mb-16">Dibuat & Disetujui Oleh<br>Manajer Koperasi</p>
            ${emp.approval.manager.date ? `<div class="text-xs border border-green-600 text-green-700 font-bold p-1 mb-1">DIGITALLY SIGNED<br>${new Date(emp.approval.manager.date).toLocaleDateString('id-ID')}</div>` : ''}
            <p class="font-bold underline">( ................................. )</p>
          </div>
          <div class="text-center w-1/3">
            <p class="mb-16">Mengetahui<br>Ketua Pengurus</p>
            ${emp.approval.head.date ? `<div class="text-xs border border-green-600 text-green-700 font-bold p-1 mb-1">DIGITALLY SIGNED<br>${new Date(emp.approval.head.date).toLocaleDateString('id-ID')}</div>` : ''}
            <p class="font-bold underline">( ................................. )</p>
          </div>
        </div>
        <p class="text-center text-xs mt-8 italic">Dokumen ini dicetak melalui Sistem Manajemen Kinerja Kopkar AKM pada ${date}</p>
      </div>
      `;
    }

    // --- LOGIC & ACTIONS ---
    function setTab(id, empId) {
      state.activeTab = id;
      if(empId) state.selectedEmpId = empId;
      saveState();
    }
    
    function changeEmp(id) {
      state.selectedEmpId = id;
      renderApp();
    }

    function updateScore(empId, type, idx, val) {
      state.employees[empId][type][idx].current = parseInt(val);
      saveState();
    }

    function updateKpiStatus(empId, idx, status) {
      if (status === false) {
        // We need a small timeout to allow UI to update before prompt blocks
        setTimeout(() => {
          const reason = prompt("Masukkan alasan/kendala mengapa target ini tidak tercapai:");
          if (reason !== null) {
             state.employees[empId].kpis[idx].reason = reason;
             state.employees[empId].kpis[idx].status = status;
             saveState();
          }
        }, 50);
      } else {
        state.employees[empId].kpis[idx].reason = ""; 
        state.employees[empId].kpis[idx].status = status;
        saveState();
      }
    }

    function updateText(field, val) {
      state.employees[state.selectedEmpId][field] = val;
      saveState();
    }

    function approve(role) {
      if(confirm('Setujui dokumen ini secara digital?')) {
        state.employees[state.selectedEmpId].approval[role].date = new Date().toISOString();
        saveState();
      }
    }

    function deleteItem(type, empId, idx) {
      if(confirm('Hapus item ini?')) {
        state.employees[empId][type].splice(idx, 1);
        saveState();
      }
    }

    // MODAL LOGIC
    function openModal(type, empId) {
      state.isModalOpen = true;
      state.modalConfig = { type, empId };
      const backdrop = document.getElementById('modal-backdrop');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');
      
      backdrop.classList.remove('hidden');
      setTimeout(() => backdrop.classList.remove('opacity-0'), 10);

      if(type === 'ADD_KPI') {
        title.innerText = 'Tambah KPI Baru';
        body.innerHTML = `
          <div class="space-y-4">
            <div><label class="block text-sm font-medium mb-1">Nama KPI</label><input id="m-input-1" class="w-full border p-2 rounded"></div>
            <div><label class="block text-sm font-medium mb-1">Target (Sesuai Job Goal/Renstra)</label><input id="m-input-2" class="w-full border p-2 rounded"></div>
            <button onclick="submitModal()" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Simpan</button>
          </div>`;
      } else if(type === 'ADD_COMP') {
        title.innerText = 'Tambah Kompetensi';
        body.innerHTML = `
          <div class="space-y-4">
            <div><label class="block text-sm font-medium mb-1">Nama Kompetensi</label><input id="m-input-1" class="w-full border p-2 rounded"></div>
            <div><label class="block text-sm font-medium mb-1">Referensi Dokumen (SOP/Portofolio)</label><input id="m-input-ref" class="w-full border p-2 rounded" placeholder="Contoh: SOP/ADM/01"></div>
            <div><label class="block text-sm font-medium mb-1">Target Level (1-5)</label><input type="number" id="m-input-2" value="5" max="5" class="w-full border p-2 rounded"></div>
            <button onclick="submitModal()" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">Simpan</button>
          </div>`;
      } else if(type === 'GUIDE') {
        title.innerText = 'Panduan Penilaian Kompetensi (SOP)';
        body.innerHTML = `
          <div class="space-y-4 text-sm text-slate-600">
            <p class="font-bold text-slate-800">Level 1 - Pemula:</p>
            <p>Belum memahami SOP secara menyeluruh. Membutuhkan bimbingan penuh dalam pelaksanaan tugas sesuai prosedur.</p>
            
            <p class="font-bold text-slate-800">Level 2 - Dasar:</p>
            <p>Memahami SOP dasar. Mampu melaksanakan tugas rutin sesuai SOP dengan sedikit bimbingan.</p>
            
            <p class="font-bold text-slate-800">Level 3 - Menengah (Target Minimal Staf):</p>
            <p>Menguasai SOP teknis di bidangnya. Mampu bekerja mandiri sesuai standar tanpa pengawasan ketat.</p>
            
            <p class="font-bold text-slate-800">Level 4 - Mahir (Target Kepala Unit):</p>
            <p>Sangat menguasai SOP dan mampu memecahkan masalah operasional (troubleshooting). Mampu membimbing orang lain.</p>
            
            <p class="font-bold text-slate-800">Level 5 - Ahli (Target Manajer):</p>
            <p>Mampu mengevaluasi dan mengembangkan/merevisi SOP. Menjadi rujukan utama dalam kepatuhan dan standar kerja.</p>
          </div>
          <div class="mt-6 text-right">
            <button onclick="closeModal()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded hover:bg-slate-300">Tutup</button>
          </div>`;
      }
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('opacity-0');
      setTimeout(() => { backdrop.classList.add('hidden'); state.isModalOpen = false; }, 300);
    }

    function submitModal() {
      if(state.modalConfig.type === 'GUIDE') return; // No submit for guide

      const v1 = document.getElementById('m-input-1').value;
      const v2 = document.getElementById('m-input-2').value;
      const vRef = document.getElementById('m-input-ref') ? document.getElementById('m-input-ref').value : '';
      const { type, empId } = state.modalConfig;

      if(type === 'ADD_KPI') {
        state.employees[empId].kpis.push({ name: v1, target: v2, status: null, reason: '' });
      } else {
        state.employees[empId].competencies.push({ name: v1, ref: vRef, target: parseInt(v2), current: 0 });
      }
      closeModal();
      saveState();
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
        // Perbaikan: Memastikan elemen "current-date" ada sebelum mengakses propertinya.
        const dateElement = document.getElementById('current-date');
        if (dateElement) {
            dateElement.innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        renderApp();
    });
  </script>
</body>
</html>
